name: Deploy Frontend (video_demo)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rytsense-technologies/video_demo-frontend
  FRONTEND_PORT: 3100
  # Backend runs on host port 8100 - see b2b_projectk deploy workflow.
  BACKEND_PORT: 8100

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN works if the org/repo allows package pushes; if not,
          # create a PAT (read:packages, write:packages) and set GHCR_TOKEN.
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Deploy frontend
        run: |
          docker rm -f xplains-frontend 2>/dev/null || true
          docker run -d --name xplains-frontend \
            --restart unless-stopped \
            -p ${{ env.FRONTEND_PORT }}:3000 \
            ${{ env.IMAGE }}:latest

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${{ env.FRONTEND_PORT }}"; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to respond" >&2
          docker logs --tail 100 xplains-frontend >&2
          exit 1