name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    # GitHub-hosted on purpose: the self-hosted runner is the production box.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Same major as the Dockerfile.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Accessibility check on public pages
        run: |
          npm start -- -p 3000 &
          npx --yes wait-on@8.0.1 --timeout 60000 http://localhost:3000/auth/login
          npm run test:a11y
